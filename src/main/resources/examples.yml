hello-world:
  description: 'My first command!'
  permission: 'ccmd.command.hello-world'
  executes:
    type: message
    message:
      message: '<green>Hello, World!'
  literal:broadcast:
    description: 'Broadcast my first command!'
    permission: 'ccmd.command.hello-world.broadcast'
    executes:
      type: message
      message:
        message: '<green>Hello, World!'
        broadcast: true

announce-restart:
  description: 'Announce an incoming restart'
  permission: 'ccmd.command.announce-restart'
  executes:
    type: title
    title:
      title: '<red>The server will restart'
      subtitle: '<red>in 1 minute!'
      broadcast: true

message:
  description: 'Message a player'
  permission: 'ccmd.command.message'
  argument:target:
    type: player
    description: 'The player to send the message to'
    argument:message:
      type: varargs_string
      description: 'The message to be sent'
      executes:
        type: javascript_reference
        javascript-file: message.js

tempban:
  description: 'Temporary ban command'
  permission: 'ccmd.command.tempban'
  argument:target:
    type: PLAYER
    description: 'The player to be banned'
    argument:time:
      type: TIME
      description: 'The time to ban the player for'
      argument:
        min-time: 20 # Optional argument for TIME
      executes:
        type: JAVASCRIPT
        javascript: |
          () => {
            const Duration = Java.type("java.time.Duration")
            # Shaded/Relocated library, therefore the 'relocated.ccmd' prefix
            const DurationFormatter = Java.type("relocated.ccmd.ontey.api.util.DurationFormatter")
          
            var ticks = args.get("time") // returns the time in ticks
            var duration = Duration.ofMillis(ticks * 50) // 1t = 50ms
          
            // No more need to resolve arguments. It's done automatically
            var player = args.get("target").getFirst()
            var formatted = DurationFormatter.formatHumanReadable(duration)
          
            player.ban("You were banned for " + formatted, duration, null)
          }

temp-boss-bar:
  description: 'Temporary boss bar'
  permission: 'ccmd.command.temp-boss-bar'
  executes:
    type: boss_bar
    boss-bar:
      name: 'Custom boss bar'
      progress: 1.0
      color: yellow
      stay-ticks: 100 # 5s

disabled-command:
  # Causes the command not to be registered.
  # The root command will still be available in '/ccmd command'
  # Any children are not parsed.
  enabled: false
  description: 'A disabled command'