plugins {
    id "java"
    id("com.gradleup.shadow") version "9.3.0"
    id("io.papermc.paperweight.userdev") version "2.0.0-beta.21"
}

group = "com.ontey"
version = "2.1-alpha"

repositories {
    mavenCentral()

    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }

    maven {
        url = "https://jitpack.io"
    }
}

tasks.shadowJar {
    relocate("ontey.api", "relocated.ccmd.ontey.api")

    archiveFileName = "CustomCommand-${version}.jar"
    destinationDirectory = file("C:\\Users\\klett\\Documents\\Minecraft\\Servers\\TestServer\\plugins")
}

dependencies {
    paperweight.paperDevBundle("26.1.2.build.+")

    // OnteyAPI
    implementation("com.github.Ontey6.OnteyAPI:paper:2.2.2:all")

    compileOnly("org.graalvm.js:js-language:25.0.3")
    compileOnly("org.graalvm.sdk:graal-sdk:25.0.3")

    // lombok
    compileOnly("org.projectlombok:lombok:1.18.42")
    annotationProcessor("org.projectlombok:lombok:1.18.42")
}

def targetJavaVersion = 25
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset "UTF-8"
    filesMatching("paper-plugin.yml") {
        expand props
    }
}
